[package]
name = "lauju_store_core"
version = "2.0.0"
edition = "2021"
description = "Memory-safe native Rust core for Lauju Barrierefreier App-Store (SHA-256, APK/ZIP structural verification, URL & filename sanitization)"

[lib]
name = "lauju_store_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
sha2 = "0.10"
hex = "0.4"
